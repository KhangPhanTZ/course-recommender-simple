# Config for the self-contained demo image (docker/Dockerfile.demo).
# Lightweight TF-IDF backend so the image is small and fits free hosting tiers.
columns:
  id:
  title: course
  description: partner
  skills: skills
  category: certificatetype
  level: level
  rating: rating
  url:

text_fields:
  - title
  - title
  - skills
  - skills
  - description
  - level
  - category

min_characters: 5
use_sbert: false          # TF-IDF: no torch / model downloads
tfidf_max_features: 20000
kmeans_k: 8
random_state: 42
top_k: 10
overfetch: 50
use_rerank: false
