# ============================================================================
# Course Recommender configuration
# Edit column names to match your CSV; the pipeline is robust to missing ones.
# ============================================================================

# --- Column mapping (source CSV -> canonical names) -------------------------
columns:
  id:                     # empty -> pipeline auto-generates a stable id
  title: course           # course title column
  description: partner    # no real description column, reuse 'partner'
  skills: skills
  category: certificatetype
  level: level
  rating: rating
  url:                    # empty -> omitted

# --- Text corpus construction ----------------------------------------------
# Repeat a field to give it more weight ("boosting").
text_fields:
  - title
  - title
  - skills
  - skills
  - description
  - level
  - category

min_characters: 30        # drop rows whose cleaned text is shorter than this

# --- Embedding backend ------------------------------------------------------
# true  -> Sentence-BERT dense vectors + FAISS/ANN index (best semantics)
# false -> TF-IDF sparse vectors + exact cosine (lightweight, no downloads)
use_sbert: true
sbert_model: sentence-transformers/all-MiniLM-L6-v2
tfidf_max_features: 50000

# --- Clustering -------------------------------------------------------------
kmeans_k: 20
random_state: 42

# --- Retrieval --------------------------------------------------------------
top_k: 10
overfetch: 50             # candidates pulled before reranking
use_rerank: false         # cross-encoder rerank (heavier, more precise)
