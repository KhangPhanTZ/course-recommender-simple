name: deploy-aws

# Builds the API image, pushes it to ECR, and rolls the ECS Fargate service.
#
# Manual only. The push trigger below is commented out on purpose: no AWS
# infrastructure is provisioned for this repository, so an automatic run fails
# at the OIDC step on every push touching src/ and leaves a red X on an
# otherwise green project. Uncomment it once the secrets and variables listed
# further down exist.
on:
  workflow_dispatch:
    inputs:
      rebuild_artifacts:
        description: "Rebuild catalog + metrics into S3 (needs ARTIFACT_S3_BUCKET var)"
        type: boolean
        default: false
      deploy_frontend:
        description: "Build + publish the SPA to CloudFront (needs WEB_BUCKET + CLOUDFRONT_DISTRIBUTION_ID vars)"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "docker/**"
  #     - "requirements-api.txt"
  #     - ".github/workflows/deploy-aws.yml"

# Required repo configuration:
#   Secrets:   AWS_DEPLOY_ROLE_ARN  (IAM role trusted for GitHub OIDC)
#   Variables: AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE
# Optional (only for the opt-in steps below):
#   Variables: ARTIFACT_S3_BUCKET, WEB_BUCKET, CLOUDFRONT_DISTRIBUTION_ID
#   Extra IAM on the deploy role: s3:PutObject/ListBucket/DeleteObject on the
#   artifact + web buckets, and cloudfront:CreateInvalidation.
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

permissions:
  id-token: write # for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -f docker/Dockerfile.api -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to ECS (force new deployment)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      # --- Opt-in: rebuild the catalog + metrics into S3 --------------------
      - name: Set up Python
        if: ${{ inputs.rebuild_artifacts }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild artifacts + metrics into S3
        if: ${{ inputs.rebuild_artifacts }}
        env:
          ARTIFACT_STORE: s3
          ARTIFACT_S3_BUCKET: ${{ vars.ARTIFACT_S3_BUCKET }}
          ARTIFACT_S3_PREFIX: artifacts
        run: |
          pip install -r requirements-lite.txt boto3
          python scripts/build_demo_artifacts.py

      # --- Opt-in: build + publish the SPA to CloudFront -------------------
      - name: Set up Node
        if: ${{ inputs.deploy_frontend }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build + publish the frontend
        if: ${{ inputs.deploy_frontend }}
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=/api npm run build
          aws s3 sync dist/ "s3://${{ vars.WEB_BUCKET }}/" --delete --region "$AWS_REGION"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
