name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install light deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Byte-compile
        run: python -m compileall -q src

      - name: Unit tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: course-recommender-api:ci
      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: course-recommender-web:ci
      - name: Build all-in-one demo image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.demo
          push: false
          tags: course-recommender-demo:ci
