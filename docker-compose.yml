# Local full-stack: FastAPI backend + React/Vite web UI (served by nginx).
#
#   1) python -m src.pipeline --mode build        # produce ./artifacts once
#   2) docker compose up --build
#   Web  -> http://localhost:8080   (UI + /api proxy)
#   API  -> http://localhost:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: course-recommender-api:local
    ports:
      - "8000:8000"
    environment:
      ARTIFACT_STORE: local
      ARTIFACT_DIR: /app/artifacts
      ENABLE_RERANK: "false"          # keep the demo snappy; set true for quality
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: course-recommender-web:local
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: api:8000          # nginx proxies /api -> this backend
    depends_on:
      api:
        condition: service_healthy
