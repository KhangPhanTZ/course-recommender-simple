# Render Blueprint — one-click deploy of the self-contained demo (UI + API).
# Deploy: https://render.com/deploy?repo=https://github.com/KhangPhanTZ/course-recommender-simple
#
# One web service builds docker/Dockerfile.demo (small TF-IDF image with a
# sample catalog baked in) and serves both the SPA and the API on one URL.
services:
  - type: web
    name: course-recommender
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.demo
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # The GenAI layer needs ANTHROPIC_API_KEY, which is set in the Render
      # dashboard rather than here so the secret stays out of the repository.
      # Without it the provider reports itself unavailable and the service
      # answers from deterministic templates, so leaving these on is safe:
      # a missing key degrades the demo, it does not break it.
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_ENABLED
        value: "true"
      # Cheapest model that still handles the query-understanding and
      # explanation prompts well; a few hundred demo requests cost under $1.
      - key: LLM_MODEL
        value: claude-haiku-4-5
